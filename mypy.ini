# Configuration of mypy for the template's own Python (.template_sync, .tools/python, tests), run by .github/workflows/tests.yml.
# A separate file (not pyproject.toml) so that nothing changes for `pip install` of an app package built from this repository.
[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = ^(\.template_sync/resources|tests/fixtures)/
warn_unused_configs = True

# Modules that do not pass mypy yet (missing annotations or optional values used without a check, found when the check was added at 0.1.18).
# They are listed one by one, not excluded, so a new error in any other module fails the check; remove an entry when its module is cleaned up.
[mypy-update_changelog,update_version_last_commit,merge_requirements,bump_constructor,v0_1_16_to_v0_1_17,test_template_sync_0_1_16,test_template_sync_0_1_17]
ignore_errors = True
