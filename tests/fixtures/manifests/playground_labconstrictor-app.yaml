# yaml-language-server: $schema=https://labconstrictor.cellmig.org/schema/labconstrictor-app.schema.json
schema: 1
name: LabConstrictor Playground
summary: Check that a computer, an installation and its GPU are in order, and that every LabConstrictor feature works.
description: |-
  Press "Check everything" to get a readout of your machine, GPU, PyTorch, a short benchmark and the internet connection, plus a report you can attach to an issue. Developers use its tools as a fixed set of cases for the napari, Fiji and QuPath bridge.
kind: utility
hosts: [notebook, napari, fiji, qupath]
distribution:
  installer: true
license: MIT
categories: [diagnostics, testing]
status: Available
inputs:
  - "Run a small test on a device: the device chosen in a dropdown (cpu, cuda:0, mps, whatever PyTorch can use here)"
  - "Feature tour: an image, or none to use a built-in demo image"
  - "Look inside a file (a text or JSON file) or summarise a table (a CSV)"
  - "Count the pixels above a level (a level that another setting switches on)"
  - "Area of the bright region (needs the pixel size, never guesses it)"
  - "Align the centres of two images (returns a 3x3 transform)"
outputs:
  - "A readout with a tick, a warning or a cross per layer, with what to do beside each cross"
  - "report.json (to attach to an issue) and summary.txt, plus benchmark.png when there is a benchmark"
  - "Make test data: small files made from a seed (a 3-channel image, an RGB image, labels, a time-lapse, a table of points)"
limitations:
  - "OpenCL on macOS is deprecated by Apple, and ROCm (AMD) works on Linux only"
  - "This first version checks PyTorch only; TensorFlow is checked inside the apps that use it"
quickstart:
  - "Install it like any LabConstrictor app and press Check everything"
  - "Read the answer: a tick is fine, a warning works but something will bite later, a cross is broken and the line below says what to do"
  - "Attach report.json to an issue"
  - "The tools also appear in napari (Plugins > LabConstrictor tools) and Fiji (Plugins > LabConstrictor > LabConstrictor Tools...)"
